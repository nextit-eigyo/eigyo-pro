name: Smoke Test (JSエラー自動チェック)

# 更新のたびに index.html をヘッドレスブラウザで読み込み、アプリが壊れていないかを自動確認する。
# 失敗すると そのコミットに赤い✗ が付く（＝更新に問題あり）。成功なら緑の✓。
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright(Chromium) を導入
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright
          # ① ブラウザ本体は確実に導入(apt不要・高速)。
          npx playwright install chromium
          # ② システム依存(apt)は「あれば入れる」best-effort。apt固着で
          #    job全体が10分タイムアウトcancelされる事故を防ぐため、最大180秒で
          #    強制終了(-k=SIGKILL)し、失敗しても続行(ubuntu-latestは必要な
          #    共有ライブラリを概ね同梱しているため本体のみでも起動可能)。
          timeout -k 20 180 npx playwright install-deps chromium \
            || echo "⚠ install-deps skipped (apt slow/unavailable) — ランナー同梱ライブラリで続行"

      - name: スモークテスト実行（JSエラー0を確認）
        run: node scripts/smoke-test.mjs
