name: Smoke Test (JSエラー自動チェック)

# 更新のたびに index.html をヘッドレスブラウザで読み込み、アプリが壊れていないかを自動確認する。
# 失敗すると そのコミットに赤い✗ が付く（＝更新に問題あり）。成功なら緑の✓。
on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright(Chromium) を導入
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright
          # apt(--with-deps)が固まって10分タイムアウトで丸ごとcancelされる事故を防止:
          # 依存導入は最大4分で打ち切り、固まったらブラウザ本体だけ入れて先へ進む
          # (ubuntu-latestランナーは必要な共有ライブラリを概ね同梱済み)。
          timeout 240 npx playwright install --with-deps chromium \
            || npx playwright install chromium

      - name: スモークテスト実行（JSエラー0を確認）
        run: node scripts/smoke-test.mjs
